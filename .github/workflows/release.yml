name: Release

on:
  workflow_dispatch:
    inputs:
      # When false, runs every check but stops before publishing, so this
      # workflow can be used as a dry run. Tag pushes always publish.
      run_publish:
        description: "Publish to npm after all checks pass"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

# One-time setup:
#   1. Create an npm granular access token (Automation type) with read/write
#      access on the @taco-ai org, and enable "Bypass 2FA" — without it npm
#      answers EOTP and refuses to publish from a non-interactive runner.
#   2. Add it as the repository secret NPM_TOKEN (Settings → Secrets and
#      variables → Actions → New repository secret).
#   3. Bump `version` in package.json, commit, then push a matching vX.Y.Z tag.
#
# A failed publish is retried by re-running this workflow with run_publish=true
# rather than by re-tagging, so a published version is never re-tagged.
#
# `--provenance` is deliberately omitted: npm's registry validates the sigstore
# bundle against the source repository's visibility and rejects private repos
# with E422 ("Unsupported GitHub Actions source repository visibility:
# 'private'"). Re-add the flag once the repository goes public.
#
# Trusted publishing (OIDC) is the follow-on: npm cannot pre-configure a
# trusted publisher for a package that does not exist yet, so the token above is
# what publishes the first version. Once the package exists, replace it with
# trusted publishing on npmjs.com (Settings → Trusted publishing).
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # required for provenance once the repo goes public
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json
        if: github.event_name == 'push'
        run: |
          node -e '
            const { version } = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (version !== tag) {
              console.error(
                `Tag ${process.env.GITHUB_REF_NAME} does not match package.json version ${version}`,
              );
              process.exit(1);
            }
            console.log(`Releasing ${version}`);
          '

      - run: pnpm docs:telemetry:check

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.run_publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
